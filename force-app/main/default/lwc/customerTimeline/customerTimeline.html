<template>
    <lightning-card title="Customer Timeline">
        <template if:true={timelineData}>
            <ul class="slds-list_dotted">
                <template for:each={timelineData} for:item="item">
                    <li key={item.date}>
                        <strong>{item.type}</strong>: {item.subject} — 
                        <lightning-formatted-date-time value={item.date}></lightning-formatted-date-time>
                    </li>
                </template>
            </ul>
        </template>
        <template if:true={error}>
            <p class="slds-text-color_error">{error}</p>
        </template>
    </lightning-card>
</template>
